---
- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  become: true

- name: Install Python Docker SDK
  ansible.builtin.apt:
    name: python3-docker
    state: present
  become: true
  
- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Add Ubuntu user to Docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
  become: true