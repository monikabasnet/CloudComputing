---
- name: Install OpenJDK 17
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
  become: true

- name: Create Kafka system group
  ansible.builtin.group:
    name: kafka
    system: true
    state: present
  become: true

- name: Create Kafka system user
  ansible.builtin.user:
    name: kafka
    group: kafka
    system: true
    shell: /usr/sbin/nologin
    home: /opt/kafka
    create_home: false
    state: present
  become: true

- name: Create Kafka directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0750"
  loop:
    - /opt/kafka
    - /var/lib/kafka
  become: true

- name: Download Apache Kafka
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_2.13-{{ kafka_version }}.tgz"
    mode: "0644"
  become: true

- name: Extract Apache Kafka
  ansible.builtin.unarchive:
    src: "/tmp/kafka_2.13-{{ kafka_version }}.tgz"
    dest: /opt/kafka
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: kafka
    group: kafka
    creates: /opt/kafka/bin/kafka-server-start.sh
  become: true

- name: Configure Kafka KRaft server
  ansible.builtin.copy:
    dest: /opt/kafka/config/server.properties
    owner: kafka
    group: kafka
    mode: "0640"
    content: |
      process.roles=broker,controller
      node.id=1

      controller.quorum.bootstrap.servers=127.0.0.1:9093
      controller.listener.names=CONTROLLER

      listeners=PLAINTEXT://0.0.0.0:{{ kafka_port }},CONTROLLER://127.0.0.1:9093
      advertised.listeners=PLAINTEXT://{{ ansible_facts["default_ipv4"]["address"] }}:{{ kafka_port }}
      listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      log.dirs=/var/lib/kafka
      num.partitions=1
      default.replication.factor=1
      min.insync.replicas=1

      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1
      
      auto.create.topics.enable=false
  become: true
  notify: Restart Kafka

- name: Check whether Kafka storage is already formatted
  ansible.builtin.stat:
    path: /var/lib/kafka/meta.properties
  register: kafka_storage_metadata

- name: Format Kafka KRaft storage
  ansible.builtin.command:
    cmd: >
      runuser -u kafka --
      /opt/kafka/bin/kafka-storage.sh format
      --standalone
      --cluster-id {{ kafka_cluster_id }}
      --config /opt/kafka/config/server.properties
  become: true
  when: not kafka_storage_metadata.stat.exists

- name: Install Kafka systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kafka.service
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Kafka
      After=network.target

      [Service]
      Type=simple
      User=kafka
      Group=kafka
      ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties
      ExecStop=/opt/kafka/bin/kafka-server-stop.sh
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  become: true
  notify:
    - Reload systemd
    - Restart Kafka

- name: Ensure Kafka is enabled and running
  ansible.builtin.systemd:
    name: kafka
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for Kafka broker port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ kafka_port }}"
    delay: 2
    timeout: 90

- name: Check whether Kafka topic exists
  ansible.builtin.command:
    cmd: >
      runuser -u kafka --
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server 127.0.0.1:{{ kafka_port }}
      --list
  register: kafka_topics
  changed_when: false
  become: true

- name: Create Kafka topic
  ansible.builtin.command:
    cmd: >
      runuser -u kafka --
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server 127.0.0.1:{{ kafka_port }}
      --create
      --topic {{ kafka_topic }}
      --partitions 1
      --replication-factor 1
  when: kafka_topic not in kafka_topics.stdout_lines
  become: true