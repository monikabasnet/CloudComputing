apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: ca2
  labels:
    app: producer
    version: ca3
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
        version: ca3
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8000'
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command:
        - sh
        - -c
        - "until nc -z kafka 9094; do\n  echo \"Waiting for Kafka TLS port...\"\n\
          \  sleep 3\ndone\necho \"Kafka TLS port is reachable.\"\n"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: producer
        image: 913210542757.dkr.ecr.us-east-2.amazonaws.com/ca2-producer:ca3-tls-v1
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: producer-config
        ports:
        - name: metrics
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: KAFKA_BROKER
          value: kafka-0.kafka.ca2.svc.cluster.local:9094
        - name: KAFKA_SECURITY_PROTOCOL
          value: SSL
        - name: KAFKA_SSL_CA_FILE
          value: /etc/kafka-ca/ca.crt
        volumeMounts:
        - name: kafka-client-ca
          mountPath: /etc/kafka-ca
          readOnly: true
      volumes:
      - name: kafka-client-ca
        secret:
          secretName: kafka-client-ca
