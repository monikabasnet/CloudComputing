apiVersion: v1
kind: Pod
metadata:
  name: kafka-keystore-test
  namespace: ca2
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  containers:
    - name: test
      image: apache/kafka:4.3.1
      command:
        - /bin/sh
        - -c
        - |
          set -e
          test -r /etc/kafka/secrets/kafka.keystore.p12
          test -r /etc/kafka/secrets/keystore-password.txt
          test -r /etc/kafka/secrets/key-password.txt
          echo "SUCCESS: Kafka TLS files readable by UID 1000"

      volumeMounts:
        - name: kafka-keystore
          mountPath: /etc/kafka/secrets
          readOnly: true

  volumes:
    - name: kafka-keystore
      secret:
        secretName: kafka-keystore
        defaultMode: 0440
