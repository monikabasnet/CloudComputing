apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-tls-ingress
  namespace: ca2
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: producer
        - podSelector:
            matchLabels:
              app: processor
        - podSelector:
            matchLabels:
              app: kafka
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9094
