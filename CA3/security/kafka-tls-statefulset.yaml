apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ca2

spec:
  serviceName: kafka
  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: kafka
          image: apache/kafka:4.3.1

          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
            - containerPort: 9094
              name: kafka-tls

          env:
            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,SSL://:9094"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka.ca2.svc.cluster.local:9092,SSL://kafka-0.kafka.ca2.svc.cluster.local:9094"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.ca2.svc.cluster.local:9093"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/kafka"

            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: "PKCS12"

            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: "/etc/kafka/secrets/kafka.keystore.p12"

            - name: KAFKA_SSL_KEYSTORE_FILENAME
              value: "kafka.keystore.p12"

            - name: KAFKA_SSL_KEY_CREDENTIALS
              value: "key-password.txt"

            - name: KAFKA_SSL_KEYSTORE_CREDENTIALS
              value: "keystore-password.txt"

            - name: KAFKA_SSL_CLIENT_AUTH
              value: "none"

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

            - name: kafka-keystore
              mountPath: /etc/kafka/secrets
              readOnly: true

      volumes:
        - name: kafka-keystore
          secret:
            secretName: kafka-keystore
            defaultMode: 0440

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ca2-gp3
        resources:
          requests:
            storage: 5Gi
