apiVersion: v1
kind: Pod
metadata:
  name: mongodb-tls-client-test
  namespace: ca2
  labels:
    app: processor
    purpose: tls-verification
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  containers:
    - name: client
      image: 913210542757.dkr.ecr.us-east-2.amazonaws.com/ca2-processor:ca3-v1

      command:
        - python
        - -c
        - |
          import time
          while True:
              time.sleep(60)

      envFrom:
        - secretRef:
            name: processor-secret

      volumeMounts:
        - name: mongodb-ca
          mountPath: /etc/mongodb-ca
          readOnly: true

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

  volumes:
    - name: mongodb-ca
      secret:
        secretName: mongodb-client-ca
