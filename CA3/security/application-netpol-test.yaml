apiVersion: v1
kind: Pod
metadata:
  name: ca3-netpol-client
  namespace: ca2
  labels:
    app: netpol-test-client
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: client
      image: 913210542757.dkr.ecr.us-east-2.amazonaws.com/ca2-processor:ca3-v1
      command:
        - python
        - -c
        - |
          import time
          while True:
              time.sleep(60)
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
