apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ca3-storage-test
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ca2-gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ca3-storage-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: tester
      image: busybox:1.36
      command:
        - sh
        - -c
        - "echo 'CA3 EBS storage test successful' > /data/test.txt; cat /data/test.txt; sleep 300"
      volumeMounts:
        - name: test-volume
          mountPath: /data
  volumes:
    - name: test-volume
      persistentVolumeClaim:
        claimName: ca3-storage-test
