apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ca3-eks-cluster
  region: us-east-2

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: ca3-workers
    instanceType: m7i-flex.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    volumeSize: 30
    privateNetworking: false

    labels:
      workload: ca3

    tags:
      Project: CA3
      Course: CS5287