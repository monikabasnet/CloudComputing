apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: producer-metrics
  namespace: ca2
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - ca2
  selector:
    matchLabels:
      monitoring: ca3
      app: producer
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
