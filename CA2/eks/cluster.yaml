apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ca2-eks-cluster
  region: us-east-2

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: ca2-workers
    instanceType: t3.small
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    volumeSize: 20
    privateNetworking: false

    labels:
      workload: ca2

    tags:
      Project: CA2
      Course: CS5287